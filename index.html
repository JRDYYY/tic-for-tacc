<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tit for Tat</title>
<meta name="description" content="Tit for Tat – strategické vyjednávání s využitím teorie her.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout concept: four sub-pages (Home, About, Services, Contact) in one file, switched by hash. Near-black violet ground, lavender accent, deeper violet for fills and glows. */
:root{
  --bg:#0a0612;
  --bg2:#120b20;
  --fg:#efeaf8;
  --mute:#a79fba;
  --line:#2a1f42;
  --accent:#b69cf2;
  --violet:#6d3fd1;
  --violet-d:#3f2380;
  --f-display:"Unbounded","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);background-image:radial-gradient(900px circle at 50% -200px,rgba(109,63,209,.18),transparent 70%);background-repeat:no-repeat;color:var(--fg);font-family:var(--f-body);font-size:18px;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.narrow{max-width:720px}
p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:600;line-height:1.2;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,4.6vw,3.3rem);font-weight:700}
h1 em{font-style:normal;color:var(--accent)}
h2{font-size:clamp(1.5rem,3vw,2.1rem);margin-bottom:28px}
h3{font-size:1.05rem}
.muted{color:var(--mute)}
.stack{display:grid;gap:20px}
.sec{padding-block:clamp(56px,8vw,96px);border-top:1px solid;border-image:linear-gradient(90deg,transparent,#3a2a60 20%,#3a2a60 80%,transparent) 1;scroll-margin-top:calc(100px + env(safe-area-inset-top,0px))}
.eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px;font-weight:600}
 
.page{display:none}
.page.on{display:block;animation:fade .35s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.page>.sec:first-child{border-top:0;padding-top:clamp(48px,7vw,88px)}
.flinks{display:flex;gap:18px;flex-wrap:wrap}
.flinks a{text-decoration:none}.flinks a:hover{color:var(--fg)}
 
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(10,6,18,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:20px;min-height:60px;flex-wrap:wrap}
.logo{font-family:var(--f-display);font-weight:700;font-size:.95rem;text-decoration:none;letter-spacing:.02em;white-space:nowrap}
.nav{display:flex;gap:22px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{text-decoration:none;font-size:15px;color:var(--mute);white-space:nowrap;padding:6px 0}
.nav a:hover,.nav a.on{color:var(--fg)}
.nav a.on{box-shadow:0 2px 0 var(--accent)}
.lang{display:flex;gap:4px;flex:none}
.lang button{background:none;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:13px;font-weight:600;padding:4px 12px;color:var(--mute)}
.lang button[aria-pressed="true"]{background:var(--violet);color:#fff;border-color:var(--violet)}
@media(max-width:760px){
  .hdr .wrap{gap:6px 12px;padding-block:8px}
  .lang{margin-left:auto}
  .nav{order:3;width:100%;margin:0;gap:18px;padding-bottom:4px}
}
 
/* hero */
.hero{padding-block:clamp(48px,8vw,104px);background:radial-gradient(640px circle at 88% 30%,rgba(109,63,209,.28),transparent 65%),radial-gradient(520px circle at 0% 100%,rgba(63,35,128,.35),transparent 65%)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(28px,5vw,64px);align-items:center}
@media(max-width:860px){.hero .wrap{grid-template-columns:minmax(0,1fr)}}
.hero h1{margin-bottom:22px}
.hero .lead{color:var(--mute);font-size:clamp(1.05rem,1.6vw,1.25rem);max-width:46ch;margin-bottom:30px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:34px}
.btn{display:inline-block;padding:13px 24px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-weight:600;font-size:15px;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:linear-gradient(135deg,#7d4fe6,#4a2a9c);color:#fff;border-color:#7d4fe6}
.btn.pri:hover{background:linear-gradient(135deg,#8d62ee,#5733b3);border-color:#9a74f2}
.btn:hover{border-color:var(--accent)}
.creed{font-family:var(--f-display);font-weight:400;font-size:clamp(.95rem,1.5vw,1.1rem);color:var(--fg);border-left:2px solid var(--violet);padding-left:16px;max-width:40ch}
.photo{margin:0;border-radius:18px;overflow:hidden;border:1px solid #3a2a60;box-shadow:0 0 90px -24px rgba(124,77,255,.55)}
.photo img{display:block;width:100%;height:auto}
 
/* content */
.pull{border-left:2px solid var(--violet);padding-left:18px;color:var(--fg)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.tags span{background:rgba(109,63,209,.1);border:1px solid #3a2a60;border-radius:999px;padding:5px 14px;font-size:15px;color:var(--mute)}
.label{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600;margin:10px 0 8px}
.traits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;margin:8px 0}
@media(max-width:860px){.traits{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.traits{grid-template-columns:minmax(0,1fr)}}
.traits div{border-top:2px solid var(--violet);padding:14px 0 0}
.traits div:hover{border-top-color:var(--accent)}
.traits h3{margin-bottom:8px}
.traits p{font-size:16px;color:var(--mute);line-height:1.6}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px}
@media(max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.two>div{background:linear-gradient(160deg,rgba(109,63,209,.16),rgba(18,11,32,.4));border:1px solid #3a2a60;border-radius:16px;padding:24px}
.two h3{color:var(--accent);margin-bottom:8px}
 
/* history */
.era{margin-top:34px;font-family:var(--f-display);font-size:1.05rem;color:var(--accent);margin-bottom:6px}
.ev{display:grid;grid-template-columns:130px minmax(0,1fr);gap:24px;padding:18px 0;border-bottom:1px solid var(--line)}
@media(max-width:600px){.ev{grid-template-columns:minmax(0,1fr);gap:4px}}
.ev .yr{font-family:var(--f-display);font-weight:600;color:var(--accent)}
.ev h3{font-size:1rem;margin-bottom:4px}
.ev p{color:var(--mute);font-size:16.5px;line-height:1.6}
.nob{font-size:11px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--accent);color:var(--accent);padding:1px 8px;border-radius:999px;margin-left:8px;font-family:var(--f-body);font-weight:600;vertical-align:middle}
 
/* services */
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{padding-left:18px;position:relative}
.list li::before{content:"";position:absolute;left:0;top:.8em;width:6px;height:6px;background:var(--violet)}
.aud{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 40px;margin-top:20px}
@media(max-width:760px){.aud{grid-template-columns:minmax(0,1fr)}}
.aud h3{padding-bottom:10px;border-bottom:1px solid #3a2a60;margin-bottom:14px}
.aud dt{font-weight:700;margin-top:12px}
.aud dd{margin:0;color:var(--mute);font-size:16.5px;line-height:1.6}
.rows div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rows span:last-child{color:var(--mute);font-style:italic}
footer{padding-block:28px;border-top:1px solid var(--line);background:var(--bg2);color:var(--mute);font-size:15px}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:860px){#aboutgrid{grid-template-columns:minmax(0,1fr)!important}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
.page .stack>*{margin:0}
.stack h2{margin-top:28px;margin-bottom:0}
.stack h3{margin-top:24px;color:var(--accent)}
.stack>h2:first-child{margin-top:0}
.sub{margin-top:clamp(40px,6vw,64px);padding-top:clamp(40px,6vw,64px);border-top:1px solid #3a2a60}
.lp strong{color:var(--fg)}
.traits{margin:6px 0}
.mottos{list-style:none;margin:0 0 30px;padding:0;display:grid;gap:8px;max-width:46ch}
.mottos li{font-family:var(--f-display);font-size:.95rem;line-height:1.4;border-left:2px solid var(--violet);padding-left:14px;color:var(--fg)}
.aud dd:empty{display:none}
.ways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:760px){.ways{grid-template-columns:minmax(0,1fr)}}
.ways>div{background:linear-gradient(160deg,rgba(109,63,209,.16),rgba(18,11,32,.4));border:1px solid #3a2a60;border-radius:16px;padding:22px}
.ways h3{margin:0 0 8px}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>

motto:["Pravidla hry určujete vy. Výsledek garantuje matematika.","Férová strategie. Maximální zisk.","Nekompromisní ochrana. Strategický úspěch.","Byznys s otevřenou kartou, vyjednávání bez slabých míst.","Proměňujeme teorii her v neprůstřelnou byznysovou výhodu."],
lead:"Tit for tat je strategie, jejíž filozofie stojí na přirozené reciprocitě: začít otevřenou spoluprací, ale na případný podraz okamžitě reagovat odvetou a při nápravě ihned odpustit. Tento princip přímo formuje naše služby strategického vyjednávání s využitím teorie her, kde klientům pomáháme budovat čitelná, pevná a dlouhodobě zisková partnerství, zatímco je neprůstřelně chráníme před agresivními taktikami protistran. Matematická úspěšnost tohoto modelu se stala samotným základem vize naší společnosti „Tit for Tat“. Tou je kultivace tržního prostředí, kde férovost, transparentnost a předvídatelnost kroků nejsou slabostí, ale nejefektivnějším nástrojem k dosažení maximálního úspěchu v byznysu i diplomacii.",
uvod:[
["h2","Úvod"],
["p","Teorie her poskytuje matematický rámec pro analýzu strategického rozhodování, kde výsledek závisí na krocích více zúčastněných stran. Pro svůj exaktní a nezaujatý přístup nachází teorie her uplatnění v ekonomii, sociologii, psychologii, politologii a dalších disciplínách."],
["p","Ve vyspělých ekonomikách hraje klíčovou roli při analýze trhů, tvorbě firemních tržních strategií, M&A fúzích a akvizicích, aukcích včetně elektronických tržišť, tvorbě vládních politik a především při vyjednávání."],
["p","Obor teorie her je rovněž vhodnou oporou kritického, nezaujatého pohledu na svět. Teorie her je sice poměrně náročným, avšak mimořádně přínosným východiskem strategického myšlení, a je proto velmi vhodná pro střední a především vyšší management firem."],
["p","Řešíme ekonomické problémy a umožňujeme firmám činit obchodní rozhodnutí s maximální mírou jistoty. Díky našemu přístupu a metodologii doprovázíme společnosti k úspěchu a během tohoto procesu neustále analyzujeme a přepočítáváme nejvýhodnější cestu."],
["p","Nasloucháme. Ptáme se. Zkoumáme. Promýšlíme věci. Společně s našimi klienty zpochybňujeme konvence a otevíráme nové možnosti. Pomáháme lídrům, týmům a společnostem měnit pravidla hry ve svůj prospěch."],
["pull","Teorie her – obor ekonomie oceněný Nobelovou cenou – je vědecké modelování interakcí (her) mezi stranami (hráči), z nichž každá sleduje své vlastní zájmy. Ať už jako konkurence k ostatním hráčům, nebo ve spolupráci s nimi."]
],
onas:[
["h2","Tit for tat"],
["p","Tit for tat (v překladu „oko za oko“ nebo „to samé naoplátku“) je jedna z nejúspěšnějších a nejznámějších strategií v teorii her. Jejím základním principem je naprostá jednoduchost: v prvním kroku spolupracuj a v každém dalším kroku přesně zopakuj to, co tvůj protihráč udělal v kole předchozím."],
["p","Tento koncept zásadně ovlivnil naše chápání toho, jak vzniká důvěra a spolupráce v obchodu, diplomacii a každodenním vyjednávání."],
["h3","Souvislost s teorií her a Vězňovým dilematem"],
["p","Strategie plně zazářila v 80. letech 20. století, kdy americký politolog Robert Axelrod uspořádal turnaje, v nichž proti sobě nechal v opakovaném Vězňově dilematu soupeřit různé počítačové programy. Vězňovo dilema je modelová situace, kde mají oba hráči motivaci toho druhého zradit pro vlastní krátkodobý prospěch. Pokud však zradí oba, dopadnou hůře, než kdyby spolupracovali."],
["p","Turnaj, kterého se účastnili přední matematici a ekonomové, překvapivě vyhrál nejkratší program ze všech – Tit for Tat, který naprogramoval psycholog Anatol Rapoport."],
["p","Úspěch této strategie spočívá ve čtyřech klíčových vlastnostech:"],
["traits",[["Je laskavá","Nikdy nezačne zradou jako první."],["Je odvetná","Pokud ji protihráč podvede, v příštím kole mu to okamžitě oplatí, takže ji nelze beztrestně zneužívat."],["Je odpouštějící","Jakmile protihráč začne znovu spolupracovat, Tit for Tat okamžitě zapomene na staré křivdy a vrátí se ke spolupráci."],["Je čitelná","Protihráč velmi rychle pochopí pravidla hry, což ho motivuje k dlouhodobě oboustranně výhodnému chování."]]],
["h3","Historie obchodu a vyjednávání"],
["p","V historii lidského obchodu fungoval princip Tit for tat dávno předtím, než ho popsala moderní věda. V dobách, kdy neexistovaly mezinárodní soudy ani vymahatelné právo, byl mezinárodní obchod postaven čistě na opakované interakci. Obchodníci (například středověká Hansa nebo kupci na Hedvábné stezce) věděli, že pokud partnera oklamou, obchod skončí."],
["p","Při vyjednávání se tato strategie projevuje jako reciprocita. Pokud jedna strana udělá ústupek, očekává ústupek i od druhé strany. Pokud druhá strana naopak zvolí agresivní taktiku, první strana se okamžitě zatvrdí."],
["p","V moderním byznysu a diplomacii se však ukazuje jedna slabina čisté strategie Tit for tat: náchylnost k nekonečné spirále pomsty. Pokud dojde k nedorozumění nebo špatné interpretaci kroku druhé strany (např. neúmyslné zpoždění dodávky), může se spustit řetězec neustálých odvet. Proto se v praxi častěji používá upravená verze „Generous Tit for Tat“ (velkorysé oko za oko), která občas nad zradou přimhouří oko, aby zachovala dlouhodobě ziskové partnerství."],
["h2","Nemnoho historie"],
["p","Historie teorie her se vyvíjela od matematických analýz hazardních her až po univerzální nástroj pro ekonomii, biologii a vojenství a dá se rozdělit do zhruba pěti etap."],
["p","Od raných počátků, když v roce 1713 James Waldegrave poskytl vůbec první známé řešení strategické hry (pro karetní hru le Her) ve formě smíšené strategie, až k zásadnímu momentu, kdy v roce 1928 John von Neumann dokázal zásadní teorém o minimaxu pro hry dvou hráčů s nulovým součtem, čímž položil formální matematické základy oboru."],
["h3","Formování oboru a von Neumannova éra"],
["lp","V roce 1944","John von Neumann a Oskar Morgenstern vydali přelomovou knihu Theory of Games and Economic Behavior. Kniha propojila matematickou teorii her s ekonomickým chováním a představila teorii užitku."],

motto:["You set the rules of the game. Mathematics guarantees the result.","Fair strategy. Maximum profit.","Uncompromising protection. Strategic success.","Business with open cards, negotiation without weak spots.","We turn game theory into a bulletproof business advantage."],
lead:"Tit for tat is a strategy whose philosophy rests on natural reciprocity: begin with open cooperation, respond to any betrayal immediately with retaliation, and forgive at once when the other side makes amends. This principle directly shapes our strategic negotiation services using game theory, where we help clients build clear, firm and long-term profitable partnerships while protecting them bulletproof against the aggressive tactics of the other side. The mathematical success of this model has become the very foundation of the vision of our company “Tit for Tat”. That vision is the cultivation of a market environment where fairness, transparency and predictability of moves are not a weakness but the most effective tool for achieving maximum success in business and diplomacy.",
uvod:[
["h2","Introduction"],
["p","Game theory provides a mathematical framework for analysing strategic decisions where the outcome depends on the moves of several parties. Thanks to its exact and unbiased approach, game theory is used in economics, sociology, psychology, political science and other disciplines."],
["p","In advanced economies it plays a key role in market analysis, corporate market strategy, M&A mergers and acquisitions, auctions including electronic marketplaces, government policy-making and above all negotiation."],
["p","The field of game theory is also a good support for a critical, unbiased view of the world. Game theory is demanding but extremely rewarding as a basis for strategic thinking, and it is therefore very well suited to middle and especially senior management of companies."],
["p","We solve economic problems and enable companies to make business decisions with the greatest possible certainty. With our approach and methodology we accompany companies to success, constantly analysing and recalculating the most advantageous path along the way."],
["p","We listen. We ask. We investigate. We think things through. Together with our clients we challenge conventions and open up new possibilities. We help leaders, teams and companies change the rules of the game in their favour."],
["pull","Game theory – a Nobel Prize-winning field of economics – is the scientific modelling of interactions (games) between parties (players), each pursuing its own interests. Whether as competitors of the other players or in cooperation with them."]

onas:[
["h2","Tit for tat"],
["p","Tit for tat (“an eye for an eye” or “the same in return”) is one of the most successful and best-known strategies in game theory. Its basic principle is complete simplicity: cooperate on the first move and on every following move repeat exactly what your opponent did in the previous round."],
["p","This concept has fundamentally shaped our understanding of how trust and cooperation arise in business, diplomacy and everyday negotiation."],
["h3","The link to game theory and the Prisoner’s Dilemma"],
["p","The strategy shone in the 1980s, when American political scientist Robert Axelrod organised tournaments in which various computer programs competed against each other in the repeated Prisoner’s Dilemma. The Prisoner’s Dilemma is a model situation where both players are tempted to betray the other for their own short-term gain. If both betray, however, they end up worse off than if they had cooperated."],
["p","The tournament, which leading mathematicians and economists entered, was surprisingly won by the shortest program of all – Tit for Tat, programmed by psychologist Anatol Rapoport."],
["p","The success of this strategy rests on four key properties:"],
["traits",[["It is nice","It never betrays first."],["It is retaliatory","If the opponent cheats, it pays back in the very next round, so it cannot be exploited without consequences."],["It is forgiving","As soon as the opponent starts cooperating again, Tit for Tat immediately forgets old grievances and returns to cooperation."],["It is clear","The opponent quickly understands the rules of the game, which motivates long-term behaviour that benefits both sides."]]],
["h3","A history of trade and negotiation"],
["p","In the history of human trade, the Tit for tat principle was at work long before modern science described it. When there were no international courts or enforceable law, international trade was built purely on repeated interaction. Merchants (for example the medieval Hanseatic League or traders on the Silk Road) knew that if they cheated a partner, the business would end."],
["p","In negotiation this strategy appears as reciprocity. If one side makes a concession, it expects a concession from the other side as well. If the other side, on the contrary, chooses an aggressive tactic, the first side hardens at once."],
["p","In modern business and diplomacy, however, pure Tit for tat has one weakness: it is prone to an endless spiral of revenge. If a misunderstanding or misreading of the other side’s move occurs (e.g. an unintentional delivery delay), a chain of constant retaliation can start. In practice a modified version, “Generous Tit for Tat” (a generous eye for an eye), is therefore used more often. It occasionally overlooks a betrayal in order to preserve a long-term profitable partnership."],
["h2","A short history"],
["p","The history of game theory evolved from mathematical analyses of games of chance into a universal tool for economics, biology and the military, and it can be divided into roughly five stages."],
["p","From the early beginnings, when in 1713 James Waldegrave provided the first known solution of a strategic game (for the card game le Her) in the form of a mixed strategy, to the decisive moment when in 1928 John von Neumann proved the fundamental minimax theorem for two-player zero-sum games, laying the formal mathematical foundations of the field."],
["h3","The formation of the field and the von Neumann era"],
["lp","In 1944","John von Neumann and Oskar Morgenstern published the landmark book Theory of Games and Economic Behavior. The book connected mathematical game theory with economic behaviour and introduced utility theory."],
["lp","The Cold War","In the 1950s the American research institute RAND Corporation funded game theory research for military purposes, in particular for the strategy of nuclear deterrence between the USA and the USSR."],
["h3","The Nash revolution"],
["p","In 1950 John Forbes Nash Jr. defined the concept of strategic equilibrium for games with any number of players and any payoff structure."],
["lp","Nash equilibrium","This concept proved that every finite game has at least one stable situation (equilibrium) in which no player can improve their position by unilaterally changing strategy."],
["lp","The Prisoner’s Dilemma","In 1950 Merrill Flood and Melvin Dresher formulated the model of the prisoner’s dilemma, which Albert W. Tucker later named and supplemented with the story about prisoners."],
["h3","Expansion and the Nobel Prizes"],
["p","In 1965 Reinhard Selten introduced the concept of subgame perfect equilibrium, making it possible to analyse dynamic games that unfold over time."],
["p","1967: John Harsanyi developed game theory with incomplete information (Bayesian games), which made it possible to model real situations where players do not know the exact goals or cards of their opponents."],
["p","1994: John Nash, Reinhard Selten and John Harsanyi received the Nobel Prize in Economics for their fundamental contribution to the analysis of equilibria in non-cooperative game theory."],
["h3","Modern applications and evolution"],
["lp","Evolutionary game theory","In 1973 John Maynard Smith applied game theory to biology (the concept of the evolutionarily stable strategy) to explain animal behaviour without having to assume their rationality."],
["lp","Algorithms and mechanism design","At the turn of the 20th and 21st centuries game theory merged with computer science. It began to be used to design auction systems (e.g. for Google AdWords) and for algorithmic trading."],
["lp","Alvin E. Roth, Lloyd S. Shapley","They applied game theory to practical problems such as assigning students to schools or organ donation."],
["lp","2014: Regulating market power. Jean Tirole","He used game theory to analyse the behaviour of large firms and how the state can regulate them effectively."],
["lp","2020: Auction theory. Paul R. Milgrom, Robert B. Wilson","They improved auction theory and designed new auction formats that are used today, for example, to sell radio frequencies."]
],

function blocks(list){

    if(k==="p")return "<p>"+esc(b[1])+"</p>";
    if(k==="pull")return '<p class="pull">'+esc(b[1])+"</p>";
    if(k==="lp")return '<p class="lp"><strong>'+esc(b[1])+":</strong> "+esc(b[2])+"</p>";
    if(k==="ul")return '<ul class="list">'+b[1].map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+"</ul>";
    if(k==="traits")return '<div class="traits">'+b[1].map(function(x){return "<div><h3 style=\"margin:0 0 8px;color:var(--fg)\">"+esc(x[0])+"</h3><p>"+esc(x[1])+"</p></div>";}).join("")+"</div>";
    if(k==="ways")return '<div class="ways">'+b[1].map(function(x){return "<div><h3>"+esc(x[0])+"</h3><p class=\"muted\">"+esc(x[1])+"</p></div>";}).join("")+"</div>";
    if(k==="aud")return '<div class="aud" style="margin-top:8px">'+b[1].map(function(a){return "<div><h3 style=\"margin-top:0;color:var(--fg)\">"+esc(a[0])+"</h3><dl>"+a[1].map(function(o){return "<dt>"+esc(o[0])+"</dt><dd>"+esc(o[1])+"</dd>";}).join("")+"</dl></div>";}).join("")+"</div>";
    return "";
  }).join("");
}
function render(){
  var c=C[lang];
  document.documentElement.lang=lang;
  $("l-cs").setAttribute("aria-pressed",lang==="cs");$("l-en").setAttribute("aria-pressed",lang==="en");
  var n=c.nav;
  $("nav").innerHTML=[["uvod",n.uvod],["o-nas",n.onas],["sluzby",n.sluzby],["kontakt",n.kontakt]].map(function(x){return '<a href="#'+x[0]+'" data-p="'+x[0]+'">'+esc(x[1])+"</a>";}).join("");
  $("flinks").innerHTML=$("nav").innerHTML;
  $("h1").textContent=c.motto[0];$("lead").textContent=c.lead;
  $("b1").textContent=n.sluzby;$("b2").textContent=n.kontakt;

  route(true);
}
var PAGES=["uvod","o-nas","sluzby","kontakt"];
function route(keep){
  var h=(location.hash||"").replace("#","");
  if(PAGES.indexOf(h)<0)h="uvod";
  PAGES.forEach(function(p){$("p-"+p).classList.toggle("on",p===h);});
  document.querySelectorAll(".nav a").forEach(function(a){a.classList.toggle("on",a.getAttribute("data-p")===h);});
  if(keep!==true)window.scrollTo(0,0);
}
